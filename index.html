<style>
/* Layout: a working desk. Header + KPI strip, then tabbed work areas; tables scroll inside their own frames. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E9ECE8; --ink:#1A2220; --muted:#5A6661; --line:#D7DDD8;
  --accent:#1D5884; --accent-ink:#FFFFFF; --accent-soft:#E1ECF5;

  --accent:#7EB5DF; --accent-ink:#0C1720; --accent-soft:#1C2C38; --ember:#E19B5A;
  --good:#6BC28D; --good-soft:#18301F; --warn:#E2B157; --warn-soft:#352A13; --bad:#EE8379; --bad-soft:#3A1E1B; --bar:#28302D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A201E; --sunk:#151A18; --ink:#E5EAE7; --muted:#97A39E; --line:#2C3431;
  --accent:#7EB5DF; --accent-ink:#0C1720; --accent-soft:#1C2C38; --ember:#E19B5A;
  --good:#6BC28D; --good-soft:#18301F; --warn:#E2B157; --warn-soft:#352A13; --bad:#EE8379; --bad-soft:#3A1E1B; --bar:#28302D;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.note{border-left:3px solid var(--ember);background:var(--surface);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.88rem;color:var(--muted)}
.note b{color:var(--ink)}
.banner{padding:10px 14px;border-radius:8px;font-size:.88rem}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.good{background:var(--good-soft);color:var(--good)}

.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 20px}
.rule{display:flex;flex-direction:column;gap:4px}
.rule .hint{font-size:.78rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{margin-top:4px}

.w input[type=range]{width:100%;accent-color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--sunk);border-radius:8px;padding:12px}
.step .k{font-family:var(--f-mono);color:var(--ember);font-size:.8rem;font-weight:500}

.flow td,.flow th{text-align:center;padding:8px;min-width:52px}
.flow th:first-child,.flow td:first-child{text-align:left}
.heat{font-family:var(--f-mono);font-variant-numeric:tabular-nums;border-radius:4px;padding:2px 0}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.modal{background:var(--surface);border-radius:12px;max-width:900px;width:100%;max-height:90vh;display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line)}
.modal textarea{width:100%;flex:1;min-height:260px;font:12px/1.45 var(--f-mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:60}
.err{color:var(--bad);font-size:.85rem}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.rank td{padding:8px 12px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="label">Coal India Limited · Annual transfer cycle</div>
      <h1>CIL Transfer Matching</h1>
      <p>Matches executives to grade vacancies across subsidiaries by field of expertise, years in that field, grade seasoning and tenure, so each posting puts proven experience where it is needed.</p>
    </div>
    <div class="cycle">
      <span class="tag">Cycle date <b id="cycleTag" class="num"></b></span>
      <span class="tag" id="srcTag"></span>
      <span class="tag"><span class="dot"></span>Data stays in this browser</span>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="suggestions">Posting suggestions</button>
    <button role="tab" data-tab="employee">Employee view</button>
    <button role="tab" data-tab="flow">Transfer flow</button>
    <button role="tab" data-tab="rules">Rules &amp; weights</button>
    <button role="tab" data-tab="data">Data</button>
  </nav>

  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
"use strict";
/* ---------------- Reference data ---------------- */
const SUBS = {
  "ECL":{name:"Eastern Coalfields Ltd",units:["Sonepur Bazari","Rajmahal","Kunustoria","Satgram","Mugma"]},
  "BCCL":{name:"Bharat Coking Coal Ltd",units:["Barora","Kusunda","Lodna","Block II","Govindpur"]},
  "CCL":{name:"Central Coalfields Ltd",units:["Barkakana","Piparwar","Magadh-Amrapali","NK Area","Rajhara"]},
  "NCL":{name:"Northern Coalfields Ltd",units:["Jayant","Nigahi","Dudhichua","Amlohri","Khadia"]},
  "WCL":{name:"Western Coalfields Ltd",units:["Nagpur","Wani","Chandrapur","Ballarpur","Pench"]},
  "SECL":{name:"South Eastern Coalfields Ltd",units:["Gevra","Dipka","Kusmunda","Korba","Chirimiri"]},
  "MCL":{name:"Mahanadi Coalfields Ltd",units:["Talcher","Ib Valley","Lakhanpur","Jagannath","Basundhara"]},
  "CMPDI":{name:"Central Mine Planning & Design Institute",units:["HQ Ranchi","RI-1 Asansol","RI-4 Nagpur","RI-7 Bhubaneswar"]},
  "NEC":{name:"North Eastern Coalfields",units:["Margherita"]},
  "CIL HQ":{name:"CIL Headquarters",units:["Kolkata"]}
};
const SUB_ORDER = Object.keys(SUBS);
// [field, discipline, related-group, department]
const FIELDS = [
  ["L&R","Personnel","Land","Land & Revenue"],["R&R","Personnel","Land","Land & Revenue"],["Land Acquisition","Mining","Land","Land & Revenue"],
  ["Opencast Operations","Mining","MineOps","Mining (Opencast)"],["Underground Operations","Mining","MineOps","Mining (UG)"],["Mine Planning","Mining","MineOps","Planning & Projects"],
  ["Safety & Rescue","Mining","MineOps","Safety"],["Explosives & Blasting","Mining","MineOps","Mining (Opencast)"],["Coal Dispatch","Mining","Market","Sales & Dispatch"],
  ["HEMM Maintenance","E&M","Plant","E&M (HEMM)"],["Coal Handling Plant","E&M","Plant","E&M (CHP)"],["Power Distribution","E&M","Plant","E&M (Electrical)"],["Washery Operations","E&M","Plant","Washery"],
  ["Industrial Relations","Personnel","People","Personnel (IR)"],["Recruitment & Training","Personnel","People","HRD"],["Establishment & Payroll","Personnel","People","Personnel (Establishment)"],["CSR","Personnel","People","CSR"],
  ["Accounts & Audit","Finance","Money","Finance"],["Taxation","Finance","Money","Finance (Tax)"],["Budget & Costing","Finance","Money","Finance (Budget)"],["Treasury","Finance","Money","Finance"],
  ["Procurement & Contracts","Materials Management","Supply","Materials Management"],["Stores & Inventory","Materials Management","Supply","Materials Management"],
  ["Coal Sales","Marketing & Sales","Market","Sales & Marketing"],["Quality Control","Marketing & Sales","Market","Quality Control"],["Rail Logistics","Marketing & Sales","Market","Sales & Dispatch"],
  ["Environment Clearance","Environment","Green","Environment"],["Forest Clearance","Environment","Green","Environment"],["Mine Closure & Reclamation","Environment","Green","Environment"],
  ["Civil Construction","Civil","Build","Civil"],["Township & Estate","Civil","Build","Estate"],
  ["SAP ERP","Systems","Digital","Systems"],["IT Infrastructure","Systems","Digital","Systems"],
  ["Exploration Drilling","Geology","Geo","Geology"],["Geological Modelling","Geology","Geo","Geology"]
];
const FIELD_ALIASES = {"landrevenue":"L&R","landandrevenue":"L&R","lr":"L&R","lnr":"L&R","rr":"R&R","rehabilitationresettlement":"R&R","rehabilitationandresettlement":"R&R","la":"Land Acquisition","ir":"Industrial Relations","hemm":"HEMM Maintenance","chp":"Coal Handling Plant","sap":"SAP ERP","erp":"SAP ERP"};
const key = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const FIELD_BY_KEY = {}; FIELDS.forEach(f=>FIELD_BY_KEY[key(f[0])]=f);
function canonField(s){ s=String(s||"").trim(); const k=key(s); if(FIELD_BY_KEY[k]) return FIELD_BY_KEY[k][0]; if(FIELD_ALIASES[k]) return FIELD_ALIASES[k]; return s; }
const groupOf = f => (FIELD_BY_KEY[key(f)]||[])[2] || null;

const DEFAULT_RULES = {cycle:"2026-11-01",minTenure:3,retireAge:60,retireBuffer:2,threshold:45,related:50,sameDiscipline:true,interOnly:true,honorExempt:true,
  w:{field:40,years:25,grade:10,service:5,tenure:10,pref:10}};
const WEIGHT_LABELS = {field:["Expertise match","Same field scores full; a related field scores the related-field credit."],years:["Years in that field","Measured against the minimum the requirement asks for."],grade:["Seasoning in grade","Years in the current grade, full credit at 5."],service:["Total service","Full credit at 20 years."],tenure:["Tenure at current posting","Longer stays rotate first; full credit at 10 years."],pref:["Stated preference","Employee listed this subsidiary as a preference."]};
const PRIO_MULT = {High:1.15,Medium:1,Low:0.9};

/* ---------------- Sample data (fictional) ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeSample(){
  const rnd=mulberry32(20261101), pick=a=>a[Math.floor(rnd()*a.length)], rint=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const wpick=o=>{const e=Object.entries(o);let t=e.reduce((s,x)=>s+x[1],0),r=rnd()*t;for(const [k,v] of e){if((r-=v)<0)return k}return e[0][0]};
  const cyc=Date.UTC(2026,10,1), minus=y=>new Date(cyc-y*365.25*864e5).toISOString().slice(0,10);
  const FIRST=["Sanjay","Ananya","Rakesh","Priyanka","Subhash","Debashree","Amit","Kavita","Manoj","Sujata","Rajesh","Pooja","Bikash","Neha","Pradeep","Swati","Ashok","Ritu","Saurav","Madhusmita","Vikram","Anjali","Tapan","Shalini","Arvind","Ipsita","Gaurav","Nandini","Suresh","Lipika","Abhishek","Meera","Ranjit","Sneha","Dilip","Bhavna","Kiran","Arpita","Nitin","Sarita","Hemant","Rashmi","Partha","Jyoti","Alok","Smita","Venkat","Lakshmi","Imran","Farah"];
  const LAST=["Pradhan","Mohanty","Singh","Sharma","Das","Mishra","Kumar","Banerjee","Sahu","Patel","Rao","Nayak","Verma","Ghosh","Tripathi","Panda","Yadav","Chatterjee","Jha","Reddy","Sinha","Behera","Gupta","Mahato","Khan","Iyer","Oraon","Munda","Dubey","Bose"];
  const DISC_W={"Mining":30,"E&M":18,"Personnel":13,"Finance":10,"Materials Management":6,"Marketing & Sales":5,"Environment":5,"Civil":5,"Systems":4,"Geology":4};
  const SUB_W={SECL:15,MCL:15,CCL:13,NCL:12,WCL:11,ECL:10,BCCL:10,CMPDI:6,NEC:3,"CIL HQ":5};
  const EXEMPT=["Spouse posting (couple case)","Medical ground","Officers' association office-bearer"];
  const emps=[];
  for(let i=0;i<110;i++){
    const disc=wpick(DISC_W); let sub=wpick(disc==="Geology"?{CMPDI:8,SECL:2,MCL:2,CCL:2}:SUB_W);
    const grade="E"+wpick({2:7,3:15,4:20,5:18,6:16,7:13,8:7}); const g=+grade.slice(1);
    const hist=[]; let prev=0; for(let k=2;k<g;k++){const y=rint(3,4);hist.push("E"+k+":"+y);prev+=y}
    const cur=rint(1,5)+Math.round(rnd()*10)/10; hist.push(grade+":"+cur.toFixed(1)); const service=prev+cur;
    const tenure=Math.min(service,rint(1,12)+Math.round(rnd()*10)/10);
    let joinAge=rint(23,29)+(rnd()<0.14?rint(6,10):0); const age=Math.min(59.6,joinAge+service);
    const fl=FIELDS.filter(f=>f[1]===disc); const p=pick(fl);
    const ex=[[p[0],Math.max(1,Math.round(service*(0.35+rnd()*0.45)))]];
    if(rnd()<0.7){const s2=pick(fl.filter(f=>f!==p).concat(FIELDS.filter(f=>f[2]===p[2]&&f!==p)));if(s2&&!ex.some(e=>e[0]===s2[0]))ex.push([s2[0],Math.max(1,Math.round(service*(0.12+rnd()*0.3)))])}
    if(rnd()<0.25){const s3=pick(fl);if(!ex.some(e=>e[0]===s3[0]))ex.push([s3[0],Math.max(1,Math.round(service*0.15))])}
    const prefs=[]; const np=rnd()<0.4?0:(rnd()<0.6?1:2); while(prefs.length<np){const s=wpick(SUB_W);if(s!==sub&&!prefs.includes(s))prefs.push(s)}
    emps.push({EmpID:String(90011000+i*1373),Name:pick(FIRST)+" "+pick(LAST),Grade:grade,Discipline:disc,Subsidiary:sub,Unit:pick(SUBS[sub].units),Department:p[3],
      DateOfBirth:minus(age),DateOfJoining:minus(service),GradeSince:minus(cur),PostingSince:minus(tenure),GradeHistory:hist.join(";"),
      Expertise:ex.map(e=>e[0]+":"+e[1]).join(";"),PreferredSubsidiaries:prefs.join(";"),Exemption:rnd()<0.06?pick(EXEMPT):""});

/* ---------------- Matching engine ---------------- */
function empBlocks(e,R){
  const b=[];
  if(R.honorExempt&&e.exempt) b.push("Exempt: "+e.exempt);
  if(e.tenure<R.minTenure) b.push("Only "+e.tenure.toFixed(1)+" yrs at current posting (min "+R.minTenure+")");
  if(e.age!=null&&e.age>=R.retireAge-R.retireBuffer) b.push("Retires within "+R.retireBuffer+" yrs (age "+e.age.toFixed(1)+")");
  return b;
}
function evalPair(e,s,R,eb){
  const blocks=[...(eb||empBlocks(e,R))];
  if(e.grade!==s.grade) blocks.unshift("Grade "+e.grade+" ≠ "+s.grade);
  if(R.sameDiscipline&&s.disc&&e.disc&&key(e.disc)!==key(s.disc)) blocks.unshift("Discipline "+e.disc+" ≠ "+s.disc);
  if(R.interOnly&&e.sub===s.sub) blocks.unshift("Already in "+s.sub);
  // expertise
  let best={type:"none",field:"",years:0,c:0};
  const g=groupOf(s.field);
  for(const x of e.exp){
    if(x.k===s.fk){ if(best.type!=="exact"||x.years>best.years) best={type:"exact",field:x.field,years:x.years,c:1}; }
    else if(best.type!=="exact"&&g&&groupOf(x.field)===g&&R.related/100>=best.c&&x.years>=(best.type==="related"?best.years:0)) best={type:"related",field:x.field,years:x.years,c:R.related/100};

  const pref = e.prefs.length ? (e.prefs.includes(s.sub)?1:0) : 0.4;
  const comps={field:best.c,years:yfit,grade:Math.min(1,e.yGrade/5),service:Math.min(1,e.service/20),tenure:Math.min(1,e.tenure/10),pref};
  let tw=0,sc=0; for(const k in R.w){tw+=R.w[k];sc+=R.w[k]*comps[k]} const score=tw?100*sc/tw:0;
  const why=[];
  if(best.type==="exact") why.push([best.years>=min?"good":"warn",best.field+" "+fmtY(best.years)+(min?" (needs "+min+")":"")]);
  else if(best.type==="related") why.push(["warn","Related: "+best.field+" "+fmtY(best.years)]);
  else why.push(["bad","No "+s.field+" experience"]);
  why.push(["",fmtY(e.yGrade)+" in "+e.grade]);
  why.push(["",fmtY(e.tenure)+" at "+e.sub]);

}

function hungarianMin(a){ // rows n <= cols m
  const n=a.length,m=a[0].length,INF=1e18,u=new Float64Array(n+1),v=new Float64Array(m+1),p=new Int32Array(m+1),way=new Int32Array(m+1);

     :`<div class="empty-seat">No suitable internal candidate</div><div class="muted" style="font-size:.82rem">${cl.length?`${cl.length} eligible, none above cut-off ${C.R.threshold}`:"No eligible executive in this grade"}${C.R.sameDiscipline?" and discipline":""}.</div>`}

/* ----- Flow ----- */
function renderFlow(){
  const moves=C.seats.filter(s=>C.final[s.id]).map(s=>({from:C.empById.get(C.final[s.id]).sub,to:s.sub}));
  const subs=sortSubs(uniq([...C.seats.map(s=>s.sub),...C.emps.map(e=>e.sub)]));
  const M={};moves.forEach(m=>{M[m.from+">"+m.to]=(M[m.from+">"+m.to]||0)+1});const mx=Math.max(1,...Object.values(M));
  const out=s=>moves.filter(m=>m.from===s).length, inn=s=>moves.filter(m=>m.to===s).length;
  const cell=v=>v?`<span class="heat" style="display:block;background:color-mix(in srgb,var(--accent) ${Math.round(15+70*v/mx)}%,transparent);color:${v/mx>0.5?"var(--accent-ink)":"var(--ink)"}">${v}</span>`:`<span class="muted">·</span>`;
  $("#main").innerHTML=`<section class="panel">
   <div class="note"><b>Read rows as “from”, columns as “to”.</b> Every executive moved out opens a seat at the origin. Check subsidiaries with a large net outflow before approving, and feed the seats they lose into next year's requirement list.</div>
   <div class="frame"><table class="flow" style="min-width:${120+subs.length*60}px"><thead><tr><th>From \\ To</th>${subs.map(s=>`<th>${h(s)}</th>`).join("")}<th>Out</th></tr></thead><tbody>
    ${subs.map(f=>`<tr><td>${subTag(f)}</td>${subs.map(t=>`<td>${f===t?"<span class='muted'>—</span>":cell(M[f+">"+t]||0)}</td>`).join("")}<td class="num"><b>${out(f)}</b></td></tr>`).join("")}
    <tr><td class="label">In</td>${subs.map(t=>`<td class="num"><b>${inn(t)}</b></td>`).join("")}<td class="num"><b>${moves.length}</b></td></tr></tbody></table></div>
   <h3>By subsidiary</h3>
   <div class="frame"><table style="min-width:640px"><thead><tr><th>Subsidiary</th><th>Seats</th><th>Filled</th><th>Still vacant</th><th>Executives in</th><th>Executives out</th><th>Net</th></tr></thead><tbody>
    ${subs.map(s=>{const st=C.seats.filter(x=>x.sub===s),fl=st.filter(x=>C.final[x.id]).length,net=inn(s)-out(s);return `<tr><td>${subTag(s)} <span class="muted">${h((SUBS[s]||{}).name||"")}</span></td><td class="num">${st.length}</td><td class="num">${fl}</td><td class="num"${st.length-fl?" style='color:var(--bad)'":""}>${st.length-fl}</td><td class="num">${inn(s)}</td><td class="num">${out(s)}</td><td class="num" style="color:${net<0?"var(--bad)":net>0?"var(--good)":"var(--muted)"}">${net>0?"+":""}${net}</td></tr>`}).join("")}
   </tbody></table></div></section>`;
}

function ingest(kind,text,name){
  try{const rows=parseCSV(text);const objs=rowsToObjects(rows,kind==="emps"?EMP_COLS:VAC_COLS,kind==="emps"?EMP_REQ:VAC_REQ);
    if(kind==="emps"){const ids=new Set(),dup=[];objs.forEach(o=>{if(ids.has(o.EmpID))dup.push(o.EmpID);ids.add(o.EmpID)});if(dup.length)throw new Error("Duplicate EmpID: "+dup.slice(0,5).join(", "))}
    S[kind]=objs;S.src[kind]=name;S.overrides={};S.decisions={};renderAll();toast(`Loaded ${objs.length} ${kind==="emps"?"executives":"requirement lines"} from ${name}`)}
  catch(err){const el=$(kind==="emps"?"#errE":"#errV");if(el)el.textContent=err.message}
}

function sheetRows(){return C.seats.map(s=>{const id=C.final[s.id],e=id&&C.empById.get(id),p=e&&pairFor(s.id,id);
  return [s.id,s.sub,s.unit,s.dept,s.grade,s.disc,s.field,s.minY,s.prio,e?e.id:"",e?e.Name:"No suitable internal candidate",e?e.sub:"",e?e.Unit:"",e?e.Department:"",p?p.match.field+(p.match.type==="related"?" (related)":""):"",p?p.match.years:"",e?e.yGrade.toFixed(1):"",e?e.tenure.toFixed(1):"",p?Math.round(p.score):"",e?(S.overrides[s.id]!==undefined?"Manual":"Suggested"):"",S.decisions[s.id]||"Pending"]})}
function showExport(title,rows,note){

function copyText(t,ok){const fall=()=>{const ta=$("#expText");if(ta){ta.focus();ta.select()}toast("Copy blocked here. Text is selected: press Ctrl+C.")};

document.addEventListener("click",ev=>{
  const tab=ev.target.closest("#tabs button");if(tab){TAB=tab.dataset.tab;try{history.replaceState(null,"","#"+TAB)}catch(e){}renderHeader();renderTab();return}
  const a=ev.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;

  if(act==="tpl"){const k=a.dataset.k;const hdr=k==="emps"?EMP_HDR:VAC_HDR;const ex=(k==="emps"?S.emps:S.vacs).slice(0,3);showExport(k==="emps"?"Employee data template":"Requirement template",objsToRows(ex,hdr),"Header row plus three example rows. Keep the header names; extra columns are ignored.");return}
  if(act==="dump"){const k=a.dataset.k;showExport(k==="emps"?"Employee data":"Requirements",objsToRows(k==="emps"?S.emps:S.vacs,k==="emps"?EMP_HDR:VAC_HDR),"The full table currently loaded.");return}

  if(act==="dview"){DATA_VIEW=a.dataset.v;renderData();return}
  if(act==="sample"){const r=S.rules;S=freshState();S.rules=r;renderAll();toast("Sample data reloaded");return}
  if(act==="clearDec"){S.overrides={};S.decisions={};renderAll();toast("Decisions and overrides cleared");return}

document.addEventListener("change",ev=>{

document.addEventListener("dragover",ev=>{const d=ev.target.closest("[data-drop]");if(d){ev.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",ev=>{const d=ev.target.closest("[data-drop]");if(d)d.classList.remove("over")});
document.addEventListener("drop",ev=>{const d=ev.target.closest("[data-drop]");if(!d)return;ev.preventDefault();d.classList.remove("over");const f=ev.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>ingest(d.dataset.drop,r.result,f.name);r.readAsText(f)});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")$("#layer").innerHTML=""});
