<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIL Transfer Matching</title>
<script>try{var t=localStorage.getItem("ctm-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
/* Layout: HR-portal shell. Fixed left menu (drawer on phones), sticky top bar, page content in a centred column. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E9ECE8; --ink:#1A2220; --muted:#5A6661; --line:#D7DDD8;
  --accent:#1D5884; --accent-ink:#FFFFFF; --accent-soft:#E1ECF5;
  --ember:#A9581A;
  --good:#2C7A4B; --good-soft:#E0F0E5; --warn:#9A630A; --warn-soft:#FAEFD7; --bad:#AE3A31; --bad-soft:#F7E2DF;
  --bar:#E4E8E4;
  --side:#16302A; --side-ink:#DCE7E2; --side-muted:#8FA8A0; --side-hover:#21413A; --side-active:#2B5248; --side-line:#24423B;
  --s1:#2a78d6; --s2:#eb6834; --s-neutral:#B9C1BC; --st-good:#0ca30c; --st-warn:#fab219; --st-crit:#d03b3b; --st-none:#C9CFCB;
  --f-display:"Archivo","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1A201E; --sunk:#151A18; --ink:#E5EAE7; --muted:#97A39E; --line:#2C3431;
  --accent:#7EB5DF; --accent-ink:#0C1720; --accent-soft:#1C2C38; --ember:#E19B5A;
  --good:#6BC28D; --good-soft:#18301F; --warn:#E2B157; --warn-soft:#352A13; --bad:#EE8379; --bad-soft:#3A1E1B; --bar:#28302D;
  --side:#0D1311; --side-ink:#D3DED9; --side-muted:#7E948C; --side-hover:#18211E; --side-active:#1F3530; --side-line:#1C2623;
  --s1:#3987e5; --s2:#d95926; --s-neutral:#4A5450; --st-none:#3A433F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A201E; --sunk:#151A18; --ink:#E5EAE7; --muted:#97A39E; --line:#2C3431;
  --accent:#7EB5DF; --accent-ink:#0C1720; --accent-soft:#1C2C38; --ember:#E19B5A;
  --good:#6BC28D; --good-soft:#18301F; --warn:#E2B157; --warn-soft:#352A13; --bad:#EE8379; --bad-soft:#3A1E1B; --bar:#28302D;
  --side:#0D1311; --side-ink:#D3DED9; --side-muted:#7E948C; --side-hover:#18211E; --side-active:#1F3530; --side-line:#1C2623;
  --s1:#3987e5; --s2:#d95926; --s-neutral:#4A5450; --st-none:#3A433F;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- Shell ---- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand .mark{width:36px;height:36px;border-radius:9px;background:var(--ember);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.9rem;letter-spacing:.02em}
.brand b{font-family:var(--f-display);font-size:1rem;display:block;line-height:1.2;color:#fff}
:root[data-theme="dark"] .brand b{color:var(--side-ink)}
.brand span{font-size:.75rem;color:var(--side-muted)}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.nav-group .gl{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--side-muted);padding:6px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500;min-height:42px}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--ember)}
.nav a .cnt{margin-left:auto;font-size:.72rem;font-family:var(--f-mono);background:var(--ember);color:#fff;border-radius:999px;padding:0 7px;line-height:1.6}
.nav a .cnt.soft{background:var(--side-line);color:var(--side-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--side-line)}
.theme-seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--side-hover);border-radius:9px;padding:3px;gap:2px}
.theme-seg button{background:none;border:0;color:var(--side-muted);border-radius:7px;padding:6px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-size:.8rem;min-height:34px}
.theme-seg button[aria-pressed="true"]{background:var(--side-active);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--side-active);display:grid;place-items:center;font-weight:600;font-size:.8rem;color:#fff;flex:none}
.me .t{min-width:0;line-height:1.3}
.me .t b{display:block;font-size:.88rem;color:var(--side-ink)}
.me .t span{font-size:.75rem;color:var(--side-muted)}
.me button{margin-left:auto;background:none;border:1px solid var(--side-line);color:var(--side-ink);border-radius:8px;padding:6px;cursor:pointer;display:grid;place-items:center;min-width:36px;min-height:36px}
.me button:hover{background:var(--side-hover)}

.maincol{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.topbar .ttl{min-width:0}
.topbar .ttl .crumb{font-size:.75rem;color:var(--muted)}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-width:40px;min-height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--muted)}
#menuBtn{display:none}
.content{padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1320px;width:100%}
.scrim{display:none}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  #menuBtn{display:grid}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hide-sm{display:none!important}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;color:var(--muted);white-space:nowrap}
.tag b{color:var(--ink);font-weight:600}
section.panel{display:flex;flex-direction:column;gap:16px}

/* ---- Home ---- */
.hello{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.hello h1{font-size:1.75rem}
.hello p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.tasks{display:flex;flex-direction:column}
.task{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.task:last-child{border-bottom:0}
.task:hover .tt{color:var(--accent)}
.task .n{min-width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;padding:0 6px}
.task .n.bad{background:var(--bad-soft);color:var(--bad)} .task .n.warn{background:var(--warn-soft);color:var(--warn)} .task .n.good{background:var(--good-soft);color:var(--good)} .task .n.info{background:var(--accent-soft);color:var(--accent)}
.task .tt{font-weight:600}
.task .ts{font-size:.85rem;color:var(--muted)}
.task .go{margin-left:auto;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qa{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;min-height:110px}
.qa:hover{border-color:var(--accent)}
.qa .ic{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.qa b{font-size:.95rem}
.qa span{font-size:.82rem;color:var(--muted)}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:st}
@media (max-width:760px){.stages{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;padding:12px 14px 12px 14px;border-top:3px solid var(--line)}
.stage.done{border-top-color:var(--good)} .stage.now{border-top-color:var(--ember)}
.stage .sn{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stage.done .sn{color:var(--good)} .stage.now .sn{color:var(--ember)}
.stage b{display:block;margin-top:2px}
.stage span{font-size:.84rem;color:var(--muted)}
.policy{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}

/* ---- Dashboard ---- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.2}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart-card .cv{position:relative;width:100%}
.chart-card details{font-size:.85rem}
.chart-card summary{cursor:pointer;color:var(--accent)}
.meter{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface)}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---- Shared components ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 180px;min-width:0}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
input[type=search],input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%;min-height:40px}
input[type=search]{width:100%}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:40px;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.85rem;min-height:34px}
.frame{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
table.sugg{min-width:1100px}
table.sugg td.req{width:250px} table.sugg td.who{width:300px} table.sugg td.fit{width:120px} table.sugg td.dec{width:210px}
.req .t{font-weight:600}
.sub{display:inline-block;font-family:var(--f-mono);font-size:.78rem;font-weight:500;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.arrow{color:var(--muted);margin:0 4px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.p-High{background:var(--bad-soft);color:var(--bad)} .p-Medium{background:var(--warn-soft);color:var(--warn)} .p-Low{background:var(--sunk);color:var(--muted)}
.p-Approve{background:var(--good-soft);color:var(--good)} .p-Hold{background:var(--warn-soft);color:var(--warn)} .p-Reject{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.76rem;padding:1px 8px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.man{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.score{display:flex;flex-direction:column;gap:4px}
.score .n{font-family:var(--f-display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.score .n small{font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);margin-left:4px}
.bar{height:6px;border-radius:3px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.t-strong{background:var(--good)} .t-good{background:var(--accent)} .t-fair{background:var(--warn)}
.who select{width:100%;margin-top:6px}
.empty-seat{color:var(--bad);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 11px;cursor:pointer;font-size:.85rem;border-right:1px solid var(--line);min-height:36px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"][data-v="Approve"]{background:var(--good);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="Hold"]{background:var(--warn);color:var(--surface)}
.seg button[aria-pressed="true"][data-v="Reject"]{background:var(--bad);color:var(--surface)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h a{font-size:.85rem;color:var(--accent);text-decoration:none;font-weight:500}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.note{border-left:3px solid var(--ember);background:var(--surface);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.9rem;color:var(--muted)}
.note b{color:var(--ink)}
.banner{padding:10px 14px;border-radius:8px;font-size:.9rem}
.banner.bad{background:var(--bad-soft);color:var(--bad)} .banner.good{background:var(--good-soft);color:var(--good)} .banner.info{background:var(--accent-soft);color:var(--accent)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 20px}
.rule{display:flex;flex-direction:column;gap:4px}
.rule .hint{font-size:.78rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{margin-top:5px;width:18px;height:18px}
.w{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 52px;gap:10px;align-items:center}
.w input[type=range]{width:100%;accent-color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.steps{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:560px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--sunk);border-radius:8px;padding:12px}
.step .k{font-family:var(--f-mono);color:var(--ember);font-size:.8rem;font-weight:500}
.flow td,.flow th{text-align:center;padding:8px;min-width:52px}
.flow th:first-child,.flow td:first-child{text-align:left}
.heat{font-family:var(--f-mono);font-variant-numeric:tabular-nums;border-radius:4px;padding:2px 0}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.modal{background:var(--surface);border-radius:12px;max-width:900px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line)}
.modal textarea.out{width:100%;flex:1;min-height:260px;font:12px/1.45 var(--f-mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.form input{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;z-index:60}
.err{color:var(--bad);font-size:.85rem}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.rank td{padding:8px 12px}

/* ---- Language switch ---- */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeSample(){

/* ---------------- CSV ---------------- */
function parseCSV(text){
  text=String(text).replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||""; const d=(first.split("\t").length>first.split(",").length)?"\t":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===d){row.push(f);f=""} else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()!==""))rows.push(row);row=[]} else f+=c}
  row.push(f); if(row.some(x=>x.trim()!==""))rows.push(row);
  return rows;
}

function parseDate(s){

  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) return Date.UTC(+m[3],+m[2]-1,+m[1]);

}
const normGrade=g=>String(g||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function normSub(s){s=String(s||"").trim().toUpperCase().replace(/\s+/g," "); if(/^CIL\b|HQ|HEADQUARTER/.test(s)) return "CIL HQ"; if(s.startsWith("CMPDI")) return "CMPDI"; if(s==="NEC"||s.startsWith("NORTH EASTERN")) return "NEC"; return s}
function parseExpertise(s){
  return String(s||"").split(/[;|]/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const m=x.match(/^(.*?)[\s]*[:=\-–(]\s*(\d+(?:\.\d+)?)\s*(?:yrs?|years?)?\s*\)?$/i);
    const field=canonField(m?m[1]:x); return {field,k:key(field),years:m?+m[2]:0};
  });
}
const yrs=(from,to)=>from==null?null:Math.max(0,(to-from)/(365.25*864e5));
function deriveEmp(o,cyc,R,kw){
  const doj=parseDate(o.DateOfJoining), gs=parseDate(o.GradeSince), ps=parseDate(o.PostingSince), dob=parseDate(o.DateOfBirth);
  const hist=String(o.GradeHistory||"").split(/[;|]/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.split(/[:=]/);return {g:normGrade(m[0]),y:+m[1]||0}});
  const grade=normGrade(o.Grade);
  let yGrade=yrs(gs,cyc); if(yGrade==null){const h=hist.find(h=>h.g===grade);yGrade=h?h.y:0}
  let service=yrs(doj,cyc); if(service==null) service=hist.reduce((s,h)=>s+h.y,0);
  let tenure=yrs(ps,cyc); if(tenure==null) tenure=service;

  const sp=String(o.SensitivePost||"").trim(); let sens=false, sensDesc="";

  else if(sp){sens=true;sensDesc=sp.replace(/^(yes|y|true|1)\s*[-:–]?\s*/i,"")||"Sensitive post"}
  else {const d=String(o.Department||"").toLowerCase();const hit=kw.find(k=>d.includes(k));if(hit){sens=true;sensDesc=o.Department}}
  let sensYears=sens?yrs(parseDate(o.SensitivePostSince),cyc):null; if(sens&&sensYears==null) sensYears=tenure;
  return {...o,id:String(o.EmpID),grade,disc:String(o.Discipline||"").trim(),sub:normSub(o.Subsidiary),hist,yGrade,service,tenure,age:yrs(dob,cyc),
    exp:parseExpertise(o.Expertise),prefs:String(o.PreferredSubsidiaries||"").split(/[;|,]/).map(normSub).filter(Boolean),exempt:String(o.Exemption||"").trim(),
    sens,sensDesc,sensYears:sensYears||0,flag:sens&&(sensYears||0)>R.sensitiveYears};
}
function deriveSeats(vacs){
  const seats=[]; vacs.forEach((v,i)=>{const n=Math.max(1,parseInt(v.Positions,10)||1); const id=v.ReqID||("RQ-"+(i+1));
    const field=canonField(v.RequiredExpertise); const pr=/^h/i.test(v.Priority)?"High":/^l/i.test(v.Priority)?"Low":"Medium";
    for(let k=1;k<=n;k++) seats.push({id:n>1?id+"/"+k:id,req:id,sub:normSub(v.Subsidiary),unit:v.Unit||"",dept:v.Department||(FIELD_BY_KEY[key(field)]||[])[3]||"",grade:normGrade(v.Grade),disc:String(v.Discipline||"").trim(),field,fk:key(field),minY:Math.max(0,+v.MinYears||0),prio:pr,remarks:v.Remarks||""});

/* ---------------- Matching engine ---------------- */
function empBlocks(e,R){
  const b=[];
  if(R.honorExempt&&e.exempt) b.push("Exempt: "+e.exempt);
  if(e.tenure<R.minTenure) b.push("Only "+e.tenure.toFixed(1)+" yrs at current posting (min "+R.minTenure+")");
  if(e.age!=null&&e.age>=R.retireAge-R.retireBuffer) b.push("Retires within "+R.retireBuffer+" yrs (age "+e.age.toFixed(1)+")");
  return b;
}
// Scores one executive against one seat. Same grade = transfer; one grade below = promotion.
function evalPair(e,s,R,eb){
  const promo=e.grade!==s.grade; const blocks=[];
  if(promo){
    if(gnum(e.grade)+1!==gnum(s.grade)) blocks.push("Grade "+e.grade+" cannot fill an "+s.grade+" seat");
    else{
      if(!R.promotion) blocks.push("Filling by promotion is switched off");
      if(e.yGrade<R.promoYears) blocks.push("Only "+fmtY(e.yGrade)+" in "+e.grade+" (min "+R.promoYears+" for promotion)");
    }
    if(e.age!=null&&e.age>=R.retireAge-R.retireBuffer) blocks.push("Retires within "+R.retireBuffer+" yrs (age "+e.age.toFixed(1)+")");
    if(R.honorExempt&&e.exempt&&e.sub!==s.sub) blocks.push("Exempt from transfer: "+e.exempt);
  } else {
    blocks.push(...(eb||empBlocks(e,R)));
    if(R.interOnly&&e.sub===s.sub) blocks.unshift("Already in "+s.sub);
  }
  if(R.sameDiscipline&&s.disc&&e.disc&&key(e.disc)!==key(s.disc)) blocks.unshift("Discipline "+e.disc+" ≠ "+s.disc);
  let best={type:"none",field:"",years:0,c:0};
  const g=groupOf(s.field);
  for(const x of e.exp){
    if(x.k===s.fk){ if(best.type!=="exact"||x.years>best.years) best={type:"exact",field:x.field,years:x.years,c:1}; }
    else if(best.type!=="exact"&&g&&groupOf(x.field)===g&&x.years>=(best.type==="related"?best.years:0)) best={type:"related",field:x.field,years:x.years,c:R.related/100};
  }
  const min=s.minY;
  let yfit=0; if(best.type!=="none"){ yfit = min>0 ? (best.years>=min ? 0.7+0.3*Math.min(1,(best.years-min)/Math.max(min,2)) : 0.7*best.years/min) : Math.min(1,0.7+0.3*best.years/3); yfit*=best.c; }
  // Posting choices: 1st choice full credit, 2nd 75%, 3rd 50%. A promotion in the same subsidiary also counts as preferred.
  const ci=e.prefs.indexOf(s.sub);
  const pref = ci>=0?[1,0.75,0.5][Math.min(ci,2)]:((promo&&e.sub===s.sub)?1:(e.prefs.length?0:0.4));
  const comps={field:best.c,years:yfit,grade:Math.min(1,e.yGrade/5),service:Math.min(1,e.service/20),tenure:Math.min(1,e.tenure/10),pref};
  let tw=0,sc=0; for(const k in R.w){tw+=R.w[k];sc+=R.w[k]*comps[k]} const score=tw?100*sc/tw:0;
  const why=[];
  if(promo) why.push(["man","Promotion "+e.grade+" → "+s.grade]);
  if(best.type==="exact") why.push([best.years>=min?"good":"warn",best.field+" "+fmtY(best.years)+(min?" (needs "+min+")":"")]);
  else if(best.type==="related") why.push(["warn","Related: "+best.field+" "+fmtY(best.years)]);
  else why.push(["bad","No "+s.field+" experience"]);
  why.push(promo?[e.yGrade>=R.promoYears?"good":"bad",fmtY(e.yGrade)+" in "+e.grade+" (min "+R.promoYears+")"]:["",fmtY(e.yGrade)+" in "+e.grade]);
  why.push(["",fmtY(e.tenure)+" at "+e.sub]);
  if(ci>=0) why.push(["good",(e.choiceList?"Choice "+(ci+1)+": ":"Prefers ")+s.sub]);
  if(e.flag) why.push(["bad","Sensitive post "+fmtY(e.sensYears)]);
  return {eligible:blocks.length===0,blocks,score,comps,why,match:best,promo};
}
function fmtY(y){y=Math.round((+y||0)*10)/10;return y+" yr"+(y===1?"":"s")}

function hungarianMin(a){ // rows n <= cols m
  const n=a.length,m=a[0].length,INF=1e18,u=new Float64Array(n+1),v=new Float64Array(m+1),p=new Int32Array(m+1),way=new Int32Array(m+1);
  for(let i=1;i<=n;i++){p[0]=i;let j0=0;const minv=new Float64Array(m+1).fill(INF),used=new Uint8Array(m+1);
    do{used[j0]=1;const i0=p[j0];let delta=INF,j1=0;
      for(let j=1;j<=m;j++)if(!used[j]){const cur=a[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0}if(minv[j]<delta){delta=minv[j];j1=j}}
      for(let j=0;j<=m;j++){if(used[j]){u[p[j]]+=delta;v[j]-=delta}else minv[j]-=delta}
      j0=j1}while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}
  const ans=new Array(n).fill(-1);for(let j=1;j<=m;j++)if(p[j])ans[p[j]-1]=j-1;return ans;
}
// Optimal one-to-one assignment of the given seats to candidates; profit(seat, cand) > 0 means allowed.
function assign(seats,candsOf,profit,out){
  const groups=new Map();
  seats.forEach(s=>{const k=s.grade+"|"+(S.rules.sameDiscipline?key(s.disc):"");if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s)});
  for(const gs of groups.values()){
    const pool=new Map(),prof=new Map();
    gs.forEach(s=>{const m=new Map();candsOf(s).forEach(c=>{const p=profit(s,c);if(p>0){pool.set(c.e.id,c.e);m.set(c.e.id,p)}});prof.set(s.id,m)});
    const es=[...pool.values()]; if(!es.length) continue;
    const seatRows=gs.length<=es.length, rows=seatRows?gs:es, cols=seatRows?es:gs;
    const mat=rows.map(r=>cols.map(c=>{const s=seatRows?r:c,e=seatRows?c:r;return -(prof.get(s.id).get(e.id)||0)}));
    hungarianMin(mat).forEach((j,i)=>{if(j<0)return;const s=seatRows?rows[i]:cols[j],e=seatRows?cols[j]:rows[i];if(prof.get(s.id).get(e.id))out[s.id]=e.id});

}

let C=null; // computed results
function compute(){
  const R=S.rules, cyc=parseDate(R.cycle)||Date.UTC(2026,10,1);

  const emps=S.emps.map(o=>deriveEmp(o,cyc,R,kw)); const seats=deriveSeats(S.vacs);

  emps.forEach(e=>{const ch=S.choices&&S.choices[e.id];if(ch&&ch.list&&ch.list.length){e.prefs=ch.list.map(c=>c.sub);e.choiceList=ch.list;e.choiceAt=ch.at}});

  const sg=new Map(); emps.forEach(e=>{const k=e.grade+"|"+key(e.disc);if(!sg.has(k))sg.set(k,[]);sg.get(k).push(e)});
  for(const list of sg.values()){list.sort((a,b)=>(b.yGrade-a.yGrade)||(b.service-a.service)||((b.age||0)-(a.age||0))||a.id.localeCompare(b.id));list.forEach((e,i)=>{e.senRank=i+1;e.senOf=list.length})}

  const byGrade=new Map(); emps.forEach(e=>{if(!byGrade.has(e.grade))byGrade.set(e.grade,[]);byGrade.get(e.grade).push(e)});
  const cands=new Map(), pcands=new Map();

    const pl=[];if(R.promotion)for(const e of (byGrade.get("E"+(gnum(s.grade)-1))||[])){const r=evalPair(e,s,R);if(r.eligible)pl.push({e,r})}

  }

  const auto={}; seats.forEach(s=>auto[s.id]=null);
  assign(seats,s=>cands.get(s.id),(s,c)=>c.r.score>=R.threshold?c.r.score*PRIO_MULT[s.prio]+(R.sensitiveFirst&&c.e.flag?SENSITIVE_BONUS:0):0,auto);

/* ----- Shared numbers ----- */
function stats(sub){
  const seats=C.seats.filter(s=>sub?s.sub===sub:(isCIL()||s.sub===S.role)), emps=C.emps.filter(e=>sub?e.sub===sub:myEmp(e));
  const filled=seats.filter(s=>C.final[s.id]);
  const promos=filled.filter(s=>kindOf(s,C.empById.get(C.final[s.id]))==="Promotion");
  const scores=filled.map(s=>(pairFor(s.id,C.final[s.id])||{score:0}).score);
  const flagged=emps.filter(e=>e.flag), moved=flagged.filter(e=>C.seatOf[e.id]);
  const dec={Approve:0,Hold:0,Reject:0,Pending:0}; filled.forEach(s=>{const d=decOf(s.id);dec[d&&!d.stale?d.v:"Pending"]++});
  return {seats,emps,filled,promos,scores,avg:scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0,flagged,moved,dec};
}

   <p class="muted" style="margin:0;font-size:.85rem">Showing ${rows.length} of ${base.length} seats. Transfers are assigned first, giving every seat the best overall fit within its grade${C.R.sameDiscipline?" and discipline":""}. Seats still vacant are then offered to executives one grade below with at least ${C.R.promoYears} years in grade.${isCIL()?" Pick another candidate from the list to override.":""}</p>
  </section>`;

function rowSugg(s){

   <td class="who">${e?`<div style="font-weight:600">${h(e.Name)} <span class="mono muted" style="font-weight:400;font-size:.8rem">${h(e.id)}</span></div>
       <div style="font-size:.88rem">${subTag(e.sub)} ${h(e.Unit)}<span class="arrow">→</span>${subTag(s.sub)}</div>
       <div class="muted" style="font-size:.8rem">${h(e.Department||e.disc)} · ${h(e.grade)} · ${fmtY(e.service)} service</div>
       <div class="chips" style="margin-top:4px">${promo?`<span class="chip man">Promotion</span>`:""}${e.flag?`<span class="chip bad">Sensitive-post rotation</span>`:""}${man?`<span class="chip man">Manual choice</span>`:""}${conflict?`<span class="chip bad">Also posted elsewhere</span>`:""}${p&&!p.eligible?`<span class="chip bad">${h(p.blocks[0])}</span>`:""}</div>`
     :`<div class="empty-seat">No suitable internal candidate</div><div class="muted" style="font-size:.82rem">${(C.cands.get(s.id)||[]).length+(C.pcands.get(s.id)||[]).length?`Eligible executives found, none above cut-off ${C.R.threshold}`:"No eligible executive by transfer or promotion"}.</div>`}

  </tr>`;
}

    ${fRows||`<tr><td colspan="5" class="muted">No executive has held a sensitive post for more than ${R.sensitiveYears} years.</td></tr>`}</tbody></table></div>
   <div class="note"><b>Promotion.</b> An executive is eligible for the next grade after at least ${R.promoYears} years in the present grade, and only against a vacancy. ${R.promotion?"Vacancies not filled by transfer are offered to eligible executives, best fit first.":"Filling by promotion is switched off on the Rules page."}</div>

   <div class="grid2">
    <div class="card"><h3>Suggested promotions (${promoted.length})</h3>

/* ----- Flow ----- */
function renderFlow(){
  const moves=C.seats.filter(s=>C.final[s.id]).map(s=>({from:C.empById.get(C.final[s.id]).sub,to:s.sub})).filter(m=>m.from!==m.to);
  const subs=sortSubs(uniq([...C.seats.map(s=>s.sub),...C.emps.map(e=>e.sub)]));
  const M={};moves.forEach(m=>{M[m.from+">"+m.to]=(M[m.from+">"+m.to]||0)+1});const mx=Math.max(1,...Object.values(M));
  const out=s=>moves.filter(m=>m.from===s).length, inn=s=>moves.filter(m=>m.to===s).length;
  const cell=v=>v?`<span class="heat" style="display:block;background:color-mix(in srgb,var(--accent) ${Math.round(15+70*v/mx)}%,transparent);color:${v/mx>0.5?"var(--accent-ink)":"var(--ink)"}">${v}</span>`:`<span class="muted">·</span>`;
  const local=C.seats.filter(s=>C.final[s.id]&&C.empById.get(C.final[s.id]).sub===s.sub).length;
  $("#main").innerHTML=`<section class="panel">
   <div class="note"><b>Read rows as “from”, columns as “to”.</b> Every executive moved out opens a seat at the origin. Check subsidiaries with a large net outflow before approving, and add the seats they lose to next year's requirement list. ${local?`${local} promotion${local>1?"s are":" is"} within the same subsidiary and not shown here.`:""}</div>

function ingest(kind,text,name){
  try{const rows=parseCSV(text);const objs=rowsToObjects(rows,kind==="emps"?EMP_COLS:VAC_COLS,kind==="emps"?EMP_REQ:VAC_REQ);
    const own=objs.filter(o=>normSub(o.Subsidiary)===S.role), skipped=objs.length-own.length;
    if(!own.length) throw new Error(`No rows for ${S.role} in this file. Check the Subsidiary column.`);
    own.forEach(o=>o.Subsidiary=S.role);
    const others=S[kind].filter(o=>normSub(o.Subsidiary)!==S.role); const idCol=kind==="emps"?"EmpID":"ReqID";
    const ids=new Set(others.map(o=>o[idCol])),dup=[];own.forEach(o=>{if(ids.has(o[idCol]))dup.push(o[idCol]);ids.add(o[idCol])});
    if(dup.length)throw new Error(`Duplicate ${idCol}: ${dup.slice(0,5).join(", ")}. Each ${idCol} must be unique across CIL.`);
    S[kind]=others.concat(own);S.src[kind]=name;markUpdate((kind==="emps"?"employees":"vacancies")+" uploaded");renderAll();
    toast(`Loaded ${own.length} ${kind==="emps"?"executives":"requirement lines"} for ${S.role}${skipped?` (${skipped} rows for other subsidiaries skipped)`:""}`)}
  catch(err){const el=$(kind==="emps"?"#errE":"#errV");if(el)el.textContent=err.message}
}

function t(s){if(LANG!=="hi")return s;const k=String(s);if(HI[k])return HI[k];for(const [rx,r] of HI_RX){if(rx.test(k))return k.replace(rx,r)}return s}
const ORIG=new WeakMap();
function trNode(root){
  if(LANG!=="hi"||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const p=n.parentElement;if(!p||p.closest("script,style,textarea,[data-notr]"))return;const raw=n.nodeValue,tr=raw.trim();if(!tr)return;const x=t(tr);if(x!==tr){if(!ORIG.has(n))ORIG.set(n,raw);n.nodeValue=raw.replace(tr,x)}});
  const els=root.querySelectorAll?[root,...root.querySelectorAll("[placeholder],[aria-label],[title]")]:[];
  els.forEach(el=>{if(!el.getAttribute||el.closest("[data-notr]"))return;["placeholder","aria-label","title"].forEach(a=>{const v=el.getAttribute(a);if(!v)return;const x=t(v);if(x!==v){if(!el.hasAttribute("data-o-"+a))el.setAttribute("data-o-"+a,v);el.setAttribute(a,x)}})});
}
function restoreDOM(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);while(w.nextNode()){const n=w.currentNode;if(ORIG.has(n)){n.nodeValue=ORIG.get(n);ORIG.delete(n)}}

let DEPT={sub:"",open:"",q:""};

  const match=e=>!q||[e.Name,e.id,e.Unit,e.grade,e.disc,...e.exp.map(x=>x.field)].join(" ").toLowerCase().includes(q);
  const cols=grades.length+6;

    const row=`<tr class="clickable${open?" dept-open":""}" data-act="deptOpen" data-d="${h(d)}"><td><b>${open?"▾":"▸"} ${h(d)}</b></td>${grades.map(g=>{const n=list.filter(e=>e.grade===g).length;return `<td class="num">${n||'<span class="muted">·</span>'}</td>`}).join("")}<td class="num"><b>${list.length}</b></td><td class="num"${list.some(e=>e.flag)?" style='color:var(--bad);font-weight:600'":""}>${list.filter(e=>e.flag).length}</td><td class="num">${list.filter(e=>e.choiceList).length}</td><td class="num">${seatsBy(d)}</td><td class="num">${(list.reduce((a,e)=>a+e.service,0)/list.length).toFixed(1)}</td></tr>`;

function botAsk(text){
  text=String(text||"").trim();if(!text)return;
  BOT.msgs.push({who:"user",html:h(text)});
  let r;try{r=botReply(text)}catch(err){r={html:L("Something went wrong: ","कुछ गलत हुआ: ")+h(err.message)}}
  BOT.msgs.push({who:"bot",html:r.html,acts:r.acts||[]});
  if(BOT.msgs.length>60)BOT.msgs=BOT.msgs.slice(-60);
  if(r.lang){setLang(r.lang);return}
  if(r.theme)setTheme(r.theme);
  if(r.go&&S.role)go(r.go);
  renderBot();
}
